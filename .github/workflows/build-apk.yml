name: Build Sindhi-Agro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            APP_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew in $APP_DIR"
            cd "$APP_DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            BUILD_GRADLE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
            if [ -z "$BUILD_GRADLE" ]; then
              echo "ERROR: No Android Gradle project found in repository!"
              ls -la
              exit 1
            fi
            APP_DIR=$(dirname "$BUILD_GRADLE")
            echo "No gradlew found; using system gradle in $APP_DIR"
            cd "$APP_DIR"
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sindhiagro-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
